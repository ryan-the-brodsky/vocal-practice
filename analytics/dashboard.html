// ============================================================================
//  Render: builds the page from D. No need to touch below for daily updates.
// ============================================================================
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content; };
const pct = (v, max) => Math.max(0, Math.min(100, 100*v/max));

function render(){
  document.getElementById('meta').textContent = `${D.window} · updated ${D.updated} · ${D.days} days since launch`;
  const app = document.getElementById('app');
  let h = "";

  // headline + badges
  h += `<div class="headline"><h1>${D.headline}</h1><p>${D.dek}</p>
    <div class="badges">${D.badges.map(b=>`<span class="badge ${b.cls}">${b.label} · <b>${b.val}</b></span>`).join("")}</div></div>`;

  // kpis
  h += `<div class="kpis">${D.kpis.map(k=>`<div class="kpi${k.accent?' accent':''}"><div class="num tnum">${k.num}${k.unit?`<small>${k.unit}</small>`:''}</div><div class="lbl">${k.lbl}</div></div>`).join("")}</div>`;
  h += `<p class="ratenote">⚠ The KPIs above are <b>totals since launch</b>. They rise by construction. Judge <b>growth</b> from the per-day rates below, never from a total getting bigger.</p>`;

  // the two bets
  const bet = (b, title) => `<div class="card betcard ${b.pass?'bet-pass':''}">
    <div class="bethead"><span class="t">${title} <small>${b.sub}</small></span><span class="badge ${b.pass?'pass':'flat'}"><b>${b.verdict||(b.pass?'PASSING':'FLAT')}</b></span></div>
    ${b.metrics.map(m=>`<div class="bet-metric"><span>${m.k}</span><span class="v ${m.up?'up':'flat'}">${m.v}${m.note?` <span style="font-weight:400;font-size:11px">${m.note}</span>`:''}</span></div>`).join("")}
    <div class="betnote">${b.note}</div></div>`;
  h += `<section><p class="sk">The two bets. Inflow (1A) &amp; retention (1B), co-equal</p>
    <div class="grid2">${bet(D.bets.retention,"Retention")}${bet(D.bets.inflow,"Inflow")}</div></section>`;

  // week over week
  h += `<section><p class="sk">Week over week. Pace, not totals</p><div class="card">
    <h3>7-day buckets since launch <span class="r">per-day compare · *partial</span></h3>
    <div class="wrow whead">${D.wow.head.map(x=>`<span>${x}</span>`).join("")}</div>
    ${D.wow.rows.map(r=>`<div class="wrow">${r.c.map((x,i)=>`<span${(r.up&&i>2)?' style="color:var(--accent)"':''}>${x}</span>`).join("")}</div>`).join("")}
    <div class="sub" style="margin-top:10px;font-size:12.5px;color:var(--muted)">${D.wow.note}</div></div></section>`;

  // activity: trend + funnels
  h += `<section><p class="sk">Activity. Volume &amp; funnels</p><div class="grid3">
    <div class="card"><h3>Daily volume</h3>
      <div class="legend"><span><i style="background:var(--accent)"></i>Pageviews</span><span><i style="background:var(--amber)"></i>Practice started</span></div>
      <svg class="chart" id="trend" viewBox="0 0 380 150" preserveAspectRatio="none"></svg></div>
    <div class="card"><h3>Practice funnel <span class="r">all traffic</span></h3><div class="fn">
      ${D.practiceFunnel.map((f,i)=>`<div><div class="lab"><span>${f.l}</span><span class="pc">${i==0?f.n:f.pct+'%'}</span></div><div class="ftr"><div class="ffl" style="width:${f.pct}%;background:color-mix(in srgb,var(--accent) ${100-i*22}%,var(--ground))"><span class="n">${f.n}</span></div></div></div>`).join("")}
      </div><div class="sub" style="margin-top:10px">${D.practiceNote}</div></div>
    <div class="card"><h3>ChatGPT activation <span class="r">floors</span></h3><div class="fn">
      ${D.chatgptFunnel.map((f,i)=>`<div><div class="lab"><span>${f.l}</span><span class="pc">${i==0?'100%':(f.floor?'≥':'')+f.pct+'%'}</span></div><div class="ftr"><div class="ffl" style="width:${f.pct}%;background:color-mix(in srgb,var(--accent) ${100-i*20}%,var(--ground))"><span class="n">${f.n}</span></div></div></div>`).join("")}
      </div><div class="sub" style="margin-top:10px">${D.chatgptNote}</div></div></div></section>`;

  // traffic channels + returning detail
  const maxCh = Math.max(...D.channels.map(c=>c.v));
  h += `<section><p class="sk">Traffic &amp; returning detail</p><div class="grid2">
    <div class="card"><h3>Source channels <span class="r">${D.channels.reduce((a,c)=>a+c.v,0)}+ visitors</span></h3>
      ${D.channels.map(c=>`<div class="barrow"><span class="nm"><span class="sw" style="background:${c.color}"></span>${c.nm}</span><div class="track"><div class="fill" style="width:${pct(c.v,maxCh)}%;background:${c.color}"></div></div><span class="v tnum">${c.v}</span></div><div class="sub" style="padding-left:114px">${c.sub}</div>`).join("")}</div>
    <div class="card"><h3>Returning vs new <span class="r">1B depth</span></h3>
      <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--faint);margin-bottom:6px">PAGES / VISIT</div>
      <div class="cb"><span class="k">Returning</span><div class="track" style="height:16px"><div class="fill" style="width:100%;background:var(--accent)"></div></div><span class="v">${D.returning.pagesPerVisit.ret}</span></div>
      <div class="cb"><span class="k">New</span><div class="track" style="height:16px"><div class="fill" style="width:${pct(D.returning.pagesPerVisit.new,D.returning.pagesPerVisit.ret)}%;background:var(--slate)"></div></div><span class="v">${D.returning.pagesPerVisit.new}</span></div>
      <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--faint);margin:12px 0 6px">PRACTICE STARTS / VISIT (depth)</div>
      <div class="cb"><span class="k">Returning</span><div class="track" style="height:16px"><div class="fill" style="width:100%;background:var(--accent)"></div></div><span class="v">${D.returning.depth.ret}</span></div>
      <div class="cb"><span class="k">New</span><div class="track" style="height:16px"><div class="fill" style="width:${pct(D.returning.depth.new,D.returning.depth.ret)}%;background:var(--slate)"></div></div><span class="v">${D.returning.depth.new}</span></div>
      <div class="sub" style="margin-top:12px">${D.returning.shareNote}</div></div></div></section>`;

  // inflow: Bing AI Performance (the real picture) + Ahrefs sample + crawlers
  const maxQ = Math.max(...D.bing.queries.map(q=>q.c),1);
  const maxP = Math.max(...D.bing.pages.map(p=>p.c),1);
  h += `<section><p class="sk">Inflow (1A). The real citation picture (Bing)</p>
    <div class="card" style="margin-bottom:16px">
      <h3>Bing AI Performance <span class="r">${D.bing.total} citations · ~${D.bing.avgPages} pages · 3-mo, first-party</span></h3>
      <div class="grid2" style="margin-top:4px">
        <div><div style="font-family:var(--font-mono);font-size:11.5px;color:var(--faint);margin-bottom:6px">TOP GROUNDING QUERIES (what gets us cited)</div>
          ${D.bing.queries.map(q=>`<div style="display:flex;align-items:center;gap:9px;padding:4px 0"><span style="flex:1;font-size:12.5px;min-width:0">${q.q}</span><div class="track" style="height:15px;flex:0 0 70px"><div class="fill" style="width:${pct(q.c,maxQ)}%;background:var(--accent)"></div></div><span style="font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap">${q.c} <span style="color:var(--faint);font-weight:400">${q.share}</span></span></div>`).join("")}</div>
        <div><div style="font-family:var(--font-mono);font-size:11.5px;color:var(--faint);margin-bottom:6px">TOP CITED PAGES</div>
          ${D.bing.pages.map(p=>`<div class="scrow"><span class="pl">${p.p}</span><div class="ct"><div class="cf" style="width:${pct(p.c,maxP)}%"></div></div><span class="n tnum">${p.c}</span></div>`).join("")}</div>
      </div>
      <div class="sub" style="margin-top:12px">${D.bing.note}</div></div>
    <div class="grid2">
    <div class="card"><h3>Ahrefs AI citations <span class="r">a SAMPLE. Undercounts</span></h3>
      ${D.citations.map(c=>`<div class="scrow${c.c==0?' z':''}"><span class="pl">${c.p}</span><div class="ct">${c.c>0?`<div class="cf" style="width:${pct(c.c,Math.max(...D.citations.map(x=>x.c),1))}%"></div>`:''}</div><span class="n tnum">${c.c}</span></div>`).join("")}
      <div class="sub" style="margin-top:8px">${D.citationsNote}</div></div>
    <div class="card"><h3>AI-crawler hits <span class="r">content / spoofed</span></h3>
      ${D.crawlers.map(c=>`<div class="cr${c.anth?' anth':''}"><span class="bot">${c.vendor} · <b>${c.bot}</b></span><span class="kind ${c.kind}">${c.kind}</span><span class="h tnum">${c.h}<span style="color:var(--zero);font-weight:400"> /${c.probe}</span></span></div>`).join("")}
      <div class="sub" style="margin-top:8px">${D.crawlerNote}</div></div></div></section>`;

  // investigations + findings
  h += `<section><p class="sk">Investigations &amp; findings. The running log</p><div class="grid2">
    <div class="card"><h3>Active investigations</h3>${D.investigations.map(i=>`<div class="iv"><span class="tag ${i.tag}">${i.tag==='pass'?'Passing':i.tag[0].toUpperCase()+i.tag.slice(1)}</span><span class="txt"><b>${i.t}.</b> ${i.x}</span></div>`).join("")}</div>
    <div class="card"><h3>Recent findings</h3><div class="find"><p class="dt">${D.findings.date}</p><ul>${D.findings.items.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></div></section>`;

  h += `<footer><b>Method.</b> ${D.method} · Generated by the <span class="mono">analytics-report</span> skill.</footer>`;

  app.innerHTML = h;
  drawTrend();
}

function drawTrend(){
  const svg=document.getElementById('trend'); if(!svg) return;
  const {days,pv,ps,maxY}=D.daily, NS='http://www.w3.org/2000/svg';
  const W=380,H=150,pL=22,pR=8,pT=10,pB=20,iw=W-pL-pR,ih=H-pT-pB;
  const X=i=>pL+iw*i/(days.length-1), Y=v=>pT+ih*(1-v/maxY);
  const e=(n,a)=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};
  [0,90,180].forEach(g=>{svg.appendChild(e('line',{x1:pL,y1:Y(g),x2:W-pR,y2:Y(g),stroke:'var(--hairline)','stroke-width':1}));const t=e('text',{x:pL-5,y:Y(g)+3,'text-anchor':'end'});t.textContent=g;svg.appendChild(t);});
  let ap='M'+X(0)+' '+Y(pv[0]); for(let i=1;i<pv.length;i++) ap+=' L'+X(i)+' '+Y(pv[i]);
  svg.appendChild(e('path',{d:ap+' L'+X(pv.length-1)+' '+Y(0)+' L'+X(0)+' '+Y(0)+' Z',fill:'var(--accent)','fill-opacity':'.10'}));
  svg.appendChild(e('path',{d:ap,fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round'}));
  let lp='M'+X(0)+' '+Y(ps[0]); for(let j=1;j<ps.length;j++) lp+=' L'+X(j)+' '+Y(ps[j]);
  svg.appendChild(e('path',{d:lp,fill:'none',stroke:'var(--amber)','stroke-width':2,'stroke-linejoin':'round'}));
  const tip=document.getElementById('tip');
  for(let k=0;k<days.length;k++){
    const tx=e('text',{x:X(k),y:H-7,'text-anchor':'middle'});tx.textContent=days[k];svg.appendChild(tx);
    svg.appendChild(e('circle',{cx:X(k),cy:Y(pv[k]),r:2.5,fill:'var(--accent)'}));
    svg.appendChild(e('circle',{cx:X(k),cy:Y(ps[k]),r:2.5,fill:'var(--amber)'}));
    const hit=e('rect',{x:X(k)-iw/(days.length*2),y:pT,width:iw/days.length,height:ih,fill:'transparent'});hit.style.cursor='crosshair';
    hit.addEventListener('mousemove',ev=>{tip.style.opacity='1';tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px';tip.innerHTML=`Aug ${days[k]} &middot; <b>${pv[k]}</b> views &middot; <b>${ps[k]}</b> starts`;});
    hit.addEventListener('mouseleave',()=>tip.style.opacity='0');svg.appendChild(hit);
  }
}

// theme toggle
(function(){const r=document.documentElement,b=document.getElementById('tt');
  const sysDark=()=>matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=()=>{const t=r.getAttribute('data-theme');return t?t:(sysDark()?'dark':'light');};
  b.addEventListener('click',()=>r.setAttribute('data-theme',cur()==='dark'?'light':'dark'));})();

render();
</script>
