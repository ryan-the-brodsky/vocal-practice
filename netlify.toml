# Env + plugins only — still inherits the existing Netlify UI build command and
# publish dir so it can't change the working production build. It flips the draft
# flag per deploy context (artist-spotlight drafts render on preview/branch
# deploys, hidden on production) and registers the IndexNow ping.
# See seo/artist-spotlight-partnerships-plan.md §3e.
[build.environment]
  EXPO_PUBLIC_INCLUDE_DRAFTS = "0"

# Self-gates to CONTEXT=production and never fails the build.
[[plugins]]
  package = "./plugins/indexnow"

[context.deploy-preview.environment]
  EXPO_PUBLIC_INCLUDE_DRAFTS = "1"

[context.branch-deploy.environment]
  EXPO_PUBLIC_INCLUDE_DRAFTS = "1"
